group.localgcc.compilers=gdefault
group.localgcc.compilerCategories=gcc

compiler.gdefault.exe=/usr/bin/g++
compiler.gdefault.name=g++ default
# Links made while g++-12 was installed name it g12
compiler.gdefault.alias=g12

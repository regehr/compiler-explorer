supportsExecute=false
restrictToLanguages=llvm,c,c++
localStorageFolder=/var/lib/ce/storage/
compilerCacheConfig=OnDisk(/var/lib/ce/compiler-cache,1024)
defaultLanguage=llvm
httpRoot=/ce
# Defence in depth behind nsjail: refuse flags that load code (compiler and LLVM plugins), redirect the toolchain to
# other programs, or read arguments from files. Matched against each user argument separately.
optionsForbiddenRe=^(-W[alp],)?((--?(wrapper|fplugin.*|fpass-plugin.*|specs|load|load-pass-plugin|pass-plugin|plugin.*|include|fmodule-mapper|config|ld-path|fuse-ld|gcc-toolchain)|(@.*)|-I|-i|-B.*)(=.*)?|--)$

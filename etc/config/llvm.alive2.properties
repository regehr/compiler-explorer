compilers=alive:irclang:llc:opt
defaultCompiler=alive

compiler.alive.compilerType=alive-tv
compiler.alive.supportsBinary=false
compiler.alive.supportsExecute=false
compiler.alive.groupName=Alive static verifier
compiler.alive.versionRe=LLVM version .*
compiler.alive.exe=/opt/compiler-explorer/alive2/build/alive-tv
compiler.alive.name=alive-tv

compiler.irclang.exe=/opt/compiler-explorer/latest-llvm/bin/clang++
compiler.irclang.name=clang trunk (assertions)
compiler.irclang.objdumper=/opt/compiler-explorer/latest-llvm/bin/llvm-objdump

compiler.llc.exe=/opt/compiler-explorer/latest-llvm/bin/llc
compiler.llc.name=llc trunk (assertions)

compiler.opt.exe=/opt/compiler-explorer/latest-llvm/bin/opt
compiler.opt.name=opt trunk (assertions)

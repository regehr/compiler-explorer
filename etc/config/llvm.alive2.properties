compilers=&alivetv:&aliveexec:&llvmubi:&llvmtools
defaultCompiler=alive

group.alivetv.groupName=Alive translation validator
group.alivetv.compilers=alive
group.alivetv.compilerType=alive-tv
group.alivetv.supportsBinary=false
group.alivetv.supportsExecute=false
group.alivetv.versionRe=LLVM version .*

compiler.alive.exe=/opt/compiler-explorer/alive2/build/alive-tv
compiler.alive.name=alive-tv

group.aliveexec.groupName=Alive UB-precise interpreter
group.aliveexec.compilers=alive-exec
group.aliveexec.compilerType=alive-exec
group.aliveexec.supportsBinary=false
group.aliveexec.supportsExecute=false
group.aliveexec.versionRe=LLVM version .*

compiler.alive-exec.exe=/opt/compiler-explorer/alive2/build/alive-exec
compiler.alive-exec.name=alive-exec

group.llvmubi.groupName=LLVM UB-aware interpreter
group.llvmubi.compilers=llubi
group.llvmubi.compilerType=llubi
group.llvmubi.supportsBinary=false
group.llvmubi.supportsExecute=false
group.llvmubi.versionRe=LLVM version .*

compiler.llubi.exe=/opt/compiler-explorer/latest-llvm/bin/llubi
compiler.llubi.name=llubi trunk (assertions)

group.llvmtools.groupName=Other LLVM tools
group.llvmtools.compilers=irclang:llc:opt

# llvm.defaults.properties gives each of these its own groupName, which would win over the group's,
# so restate the group's here.
compiler.irclang.groupName=Other LLVM tools
compiler.irclang.exe=/opt/compiler-explorer/latest-llvm/bin/clang++
compiler.irclang.name=clang trunk (assertions)
compiler.irclang.objdumper=/opt/compiler-explorer/latest-llvm/bin/llvm-objdump
compiler.irclang.objdumperType=llvm

compiler.llc.groupName=Other LLVM tools
compiler.llc.exe=/opt/compiler-explorer/latest-llvm/bin/llc
compiler.llc.name=llc trunk (assertions)

compiler.opt.groupName=Other LLVM tools
compiler.opt.exe=/opt/compiler-explorer/latest-llvm/bin/opt
compiler.opt.name=opt trunk (assertions)

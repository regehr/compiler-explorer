# Per client IP. Compiles are the expensive requests: CE runs only maxConcurrentCompiles at once and queues the rest,
# so one client mustn't be able to hold every slot. A UI with several compiler panes sends one request per pane on
# each edit, hence the burst. Each shortlink is a file in /var/lib/ce/storage that is never deleted.
limit_req_zone $binary_remote_addr zone=ce_compile:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=ce_compile_conn:10m;
limit_req_zone $binary_remote_addr zone=ce_share:10m rate=10r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # CE's own default limit is 1mb (maxUploadSize); nginx's default is also 1m, so make it explicit
    client_max_body_size 2m;

    limit_req_status 429;
    limit_conn_status 429;

    # Inherited by every location below, none of which sets its own
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # compiles can be slow; don't cut them off at nginx's 60s default
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # CE is served under /ce (httpRoot), which is where the old instance's shortlinks point
    location = / {
        return 301 /ce/;
    }

    # Case-insensitive, as Express's routing is
    location ~* ^/ce/api/compiler/[^/]+/(compile|cmake|build) {
        limit_req zone=ce_compile burst=20 nodelay;
        limit_conn ce_compile_conn 3;
        proxy_pass http://127.0.0.1:10240;
    }

    location ~* ^/ce/(api/shortener|noscript/share) {
        limit_req zone=ce_share burst=10 nodelay;
        proxy_pass http://127.0.0.1:10240;
    }

    location / {
        proxy_pass http://127.0.0.1:10240;
    }
}

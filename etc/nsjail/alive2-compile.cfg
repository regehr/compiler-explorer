name: "ce local compilation sandbox"
mode: ONCE
hostname: "ce"
time_limit: 0
log_level: FATAL

rlimit_as: 4096          # MiB of address space per process; stands in for the memory cgroup
rlimit_cpu_type: SOFT
rlimit_fsize: 1024       # MiB
rlimit_nofile: 300

uidmap { inside_id: "10240" }
gidmap { inside_id: "10240" }

mount { src: "/bin"  dst: "/bin"  is_bind: true }
mount { src: "/lib"  dst: "/lib"  is_bind: true }
mount { src: "/lib64" dst: "/lib64" is_bind: true mandatory: false }
mount { src: "/lib32" dst: "/lib32" is_bind: true mandatory: false }
mount { src: "/usr"  dst: "/usr"  is_bind: true }
mount { src: "/opt/compiler-explorer" dst: "/opt/compiler-explorer" is_bind: true }
mount { src: "/etc/alternatives" dst: "/etc/alternatives" is_bind: true mandatory: false }
mount { src: "/etc/localtime" dst: "/etc/localtime" is_bind: true }
mount { src: "/etc/ld.so.conf.d" dst: "/etc/ld.so.conf.d" is_bind: true }
mount { src: "/etc/ld.so.conf" dst: "/etc/ld.so.conf" is_bind: true }
mount {
    src_content: "nobody:x:65534:65534:Not root:/root:/none\nce:x:10240:10240:Not a real account:/app:/bin/bash"
    dst: "/etc/passwd"
    is_bind: true
}
mount { src_content: "nogroup:x:65534:\n\nce:x:10240:" dst: "/etc/group" is_bind: true }

mount {
    dst: "/tmp"
    fstype: "tmpfs"
    options: "size=536870912,nr_inodes=1000"
    rw: true
    noexec: true
    nodev: true
    nosuid: true
}
mount { src: "/dev/null" dst: "/dev/null" rw: true is_bind: true }
mount { src: "/dev/zero" dst: "/dev/zero" is_bind: true }
mount { src: "/dev/urandom" dst: "/dev/random" is_bind: true }
mount { src: "/dev/urandom" dst: "/dev/urandom" is_bind: true }
mount { dst: "/proc" fstype: "proc" }
mount { src: "/sys/devices/system/cpu" dst: "/sys/devices/system/cpu" is_bind: true }
